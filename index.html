<script type="module">
import { ROLE_NAME, MIN, MAX, DUR, LOBBY_WAIT, BOT_NAMES, stepRoom, lobbyFillAt } from './rules.js';

/* ============ Backend: Firebase Realtime Database hoặc chế độ thử (localStorage) ============ */
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));

function localBackend() {
  const KEY = 'masoi_local_db';
  let data = JSON.parse(localStorage.getItem(KEY) || '{}');
  const watchers = [];
  const keys = p => p.split('/').filter(Boolean);
  const getp = p => { let o = data; for (const k of keys(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; };
  const setp = (p, v) => {
    const ks = keys(p); let o = data;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  };
  const save = () => localStorage.setItem(KEY, JSON.stringify(data));
  const notify = () => watchers.slice().forEach(w => w.cb(clone(getp(w.p))));
  window.addEventListener('storage', e => { if (e.key === KEY) { data = JSON.parse(e.newValue || '{}'); notify(); } });
  return {
    mode: 'local',
    get: async p => clone(getp(p)),
    set: async (p, v) => { setp(p, v); save(); notify(); },
    update: async u => { for (const [p, v] of Object.entries(u)) setp(p, v); save(); notify(); },
    watch: (p, cb) => { const w = { p, cb }; watchers.push(w); cb(clone(getp(p))); return () => { const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1); }; }
  };
}

async function makeBackend() {
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL) {
    const V = '10.14.1';
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const m = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
    const db = m.getDatabase(initializeApp(cfg));
    return {
      mode: 'firebase',
      get: async p => (await m.get(m.ref(db, p))).val(),
      set: (p, v) => m.set(m.ref(db, p), v),
      update: u => m.update(m.ref(db), u),
      watch: (p, cb) => m.onValue(m.ref(db, p), s => cb(s.val()))
    };
  }
  return localBackend();
}

/* ============ Trạng thái ============ */
const $app = document.getElementById('app');
const ROLE_HINT = {
  wolf: 'Mỗi đêm cùng đồng bọn chọn một người để cắn.',
  seer: 'Mỗi đêm soi một người xem có phải Sói không.',
  guard: 'Mỗi đêm bảo vệ một người (kể cả bạn) khỏi bị cắn.',
  vill: 'Ban ngày thảo luận và bỏ phiếu treo cổ Sói.'
};
let B, S = null, unwatch = null, botBeat = 0, beatLoaded = false;
let cDraft = '', auth = null, authName = '', authPass = '', authErr = '', authBusy = false, rankData = null, rankLoading = false, showRank = false, donateOk = false, msgName = '', msgText = '', msgStatus = '', msgSentAt = 0;
let game = 'masoi', C = null, cme = null, cUnwatch = null, cSig = '', cBeatSent = false;
let me = null;
let showRole = false, pick = null, pickKey = '';
let homeName = '', homeCode = '', homeErr = '';
let chatTab = 'day', chatDraft = '', showHelp = false, roleSeen = false, inviteMsg = '', inviteText = '';

/* ============ Vào / rời phòng ============ */
const CODE_RE = /^[A-Z0-9]{2,8}$/;
const ONLINE_MS = 30000;   // quá 30 giây không có nhịp tim thì coi là đã ngắt kết nối
const isOnline = (room, pid) => { const t = (room.seen || {})[pid]; return !!t && Date.now() - t < ONLINE_MS; };
async function joinOrCreate() {   // phòng có sẵn thì vào, chưa có thì tạo phòng mới với đúng số phòng đó
  const name = homeName.trim(), code = homeCode.replace(/\s+/g, '').toUpperCase();
  if (!name) return setErr('Nhập tên của bạn.');
  if (!CODE_RE.test(code)) return setErr('Số phòng gồm 2 đến 8 chữ hoặc số (không dấu, không ký tự đặc biệt).');
  homeCode = code;
  const room = await B.get('rooms/' + code);
  if (!room) {
    const pid = rid();
    await B.set('rooms/' + code, { host: pid, phase: 'lobby', round: 0, createdAt: Date.now(), allowSpec: true, players: { [pid]: { name, alive: true, t: Date.now() } }, seen: { [pid]: Date.now() } });
    return enter({ pid, name, code });
  }
  const players = room.players || {};
  const same = Object.entries(players).find(([, p]) => !p.bot && p.name.trim().toLowerCase() === name.toLowerCase());   // người chơi (không tính người máy) trùng tên
  if (room.phase !== 'lobby') {   // ván đã bắt đầu
    if (same) {   // trùng tên người đã chơi: chỉ vào lại được khi người đó đã ngắt kết nối
      if (isOnline(room, same[0])) return setErr('Tên "' + same[1].name + '" đang có người chơi trong ván. Nếu bạn là người khác, hãy dùng tên khác để vào Khán đài. Nếu bạn vừa mất kết nối, đợi khoảng 30 giây rồi thử lại.');
      return enter({ pid: same[0], name: same[1].name, code });
    }
    if (room.allowSpec === false) return setErr('Phòng ' + code + ' đang chơi và chủ phòng đã tắt Khán đài. Hãy chọn số phòng khác.');
    return joinSpec(code, name, 'started');
  }
  if (same) {   // phòng chờ: không cho trùng tên, trừ khi người cũ đã ngắt kết nối (vào lại đúng chỗ cũ)
    if (isOnline(room, same[0])) return setErr('Tên "' + same[1].name + '" đã có người dùng trong phòng. Hãy chọn tên khác.');
    return enter({ pid: same[0], name: same[1].name, code });
  }
  if (Object.values(players).some(p => p.bot && p.name.trim().toLowerCase() === name.toLowerCase())) return setErr('Tên này dành cho người máy. Hãy chọn tên khác.');
  if (Object.keys(players).length >= MAX) {   // phòng đầy: vào Khán đài
    if (room.allowSpec === false) return setErr('Phòng ' + code + ' đã đủ ' + MAX + ' người và chủ phòng đã tắt Khán đài. Hãy chọn số phòng khác.');
    return joinSpec(code, name, 'full');
  }
  const pid = rid();
  await B.update({ ['rooms/' + code + '/players/' + pid]: { name, alive: true, t: Date.now() }, ['rooms/' + code + '/seen/' + pid]: Date.now() });
  enter({ pid, name, code });
}
async function joinSpec(code, name, why) {   // người xem: không nằm trong danh sách người chơi, thấy hết, không chat được
  const pid = rid();
  await B.set('rooms/' + code + '/spectators/' + pid, { name, t: Date.now() });
  enter({ pid, name, code, spec: true, why });
}
function setErr(m) { homeErr = m; render(); }
function enter(m) {
  me = m; store().setItem('masoi_me', JSON.stringify(me)); store().setItem('masoi_name', me.name);
  homeErr = ''; S = null; showRole = false; lastSig = ''; beatSent = false;
  if (unwatch) unwatch();
  unwatch = B.watch('rooms/' + me.code, v => {
    S = v;
    if (!S) { leaveLocal(); render(); return; }
    if (!beatSent) { beatSent = true; beat(); }
    if (!me.spec && S.phase === 'lobby' && S.players && !S.players[me.pid] && me.name) {   // bị dọn nhầm (tab nền lâu): tự vào lại phòng chờ
      B.update({ ['rooms/' + me.code + '/players/' + me.pid]: { name: me.name, alive: true, t: Date.now() }, ['rooms/' + me.code + '/seen/' + me.pid]: Date.now() });
    }
    const sig = JSON.stringify(v, (k, x) => k === 'seen' ? undefined : x);   // nhịp tim của người khác không cần vẽ lại cả trang
    if (sig === lastSig) return;
    lastSig = sig;
    if (me.spec && S.allowSpec === false) {   // chủ phòng đóng Khán đài: khán giả rời phòng
      B.set('rooms/' + me.code + '/spectators/' + me.pid, null); leaveLocal(); homeErr = 'Chủ phòng đã đóng Khán đài nên bạn đã rời phòng.'; render(); return;
    }
    tickHost();
    render();
  });
  render();
}
let lastSig = '', beatSent = false;
const beat = () => { if (me && !me.spec && S) B.set(base() + 'seen/' + me.pid, Date.now()); };   // nhịp tim: báo mình còn online
setInterval(beat, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });   // quay lại tab: báo online ngay
function leaveLocal() { if (unwatch) unwatch(); unwatch = null; S = null; me = null; store().removeItem('masoi_me'); }
async function addBot() {
  if (!S || S.phase !== 'lobby' || S.host !== me.pid) return;
  const pl = S.players || {}, used = Object.values(pl).map(p => p.name);
  if (Object.keys(pl).length >= MAX) return;
  const name = '🤖 ' + (BOT_NAMES.find(n => !used.includes('🤖 ' + n)) || 'Bot' + rid().slice(0, 3));
  await B.set(base() + 'players/bot_' + rid(), { name, alive: true, t: Date.now(), bot: true, ready: true });
}
async function leave() {
  if (me && me.spec) { await B.set('rooms/' + me.code + '/spectators/' + me.pid, null); leaveLocal(); render(); return; }
  if (S && S.phase === 'lobby') {   // ở phòng chờ: xóa tên khỏi danh sách, chủ phòng rời thì nhường người thật kế tiếp
    const code = me.code, rest = Object.entries(S.players || {}).filter(([id, p]) => id !== me.pid && !p.bot).sort((a, b) => a[1].t - b[1].t);
    const u = { ['rooms/' + code + '/players/' + me.pid]: null, ['rooms/' + code + '/seen/' + me.pid]: null };
    if (!rest.length) u['rooms/' + code] = null; else if (S.host === me.pid) u['rooms/' + code + '/host'] = rest[0][0];
    await B.update(u);
  }
  if (S && S.phase !== 'lobby' && !me.spec) await B.set(base() + 'seen/' + me.pid, 0);   // thoát giữa ván: coi là offline ngay để vào lại được liền
  leaveLocal(); render();
}

/* ============ Lệnh gửi cho bot quản trò ============ */
const sendCmd = type => B.set(base() + 'cmd', { type, by: me.pid, t: Date.now() });
const ready = () => B.set(base() + 'ready/' + me.pid, true);

// Ai chạy luật? Có bot quản trò (masoi-bot) đang chạy thì bot lo. Không có bot (hoặc chế độ thử) thì máy của chủ phòng chạy luật.
// Bot được coi là đang chạy nếu nhịp tim của nó (meta/botBeat) mới hơn 20 giây.
const botAlive = () => beatLoaded && Date.now() - botBeat < 20000;
const hostShouldRun = () => B.mode === 'local' || (beatLoaded && !botAlive());
// Người chạy luật: chủ phòng. Nếu máy chủ phòng ngừng (đóng tab, khóa máy, tab nền...) thì người thật online có tên vào phòng sớm nhất chạy thay,
// để ván không đứng. Các bước luật đều idempotent nên hai máy cùng chạy cũng không sai.
function runnerId() {
  if (!S || !S.players) return null;
  if (isOnline(S, S.host) || (S.host === (me && me.pid))) return S.host;
  const cand = Object.entries(S.players).filter(([id, p]) => !p.bot && isOnline(S, id)).sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
  return cand.length ? cand[0][0] : S.host;
}
let hostBusy = false;
async function tickHost() {
  if (!me || me.spec || !S || runnerId() !== me.pid || hostBusy || !hostShouldRun()) return;

  }

    <li>🐺 <b>Sói</b>: mỗi đêm cùng đồng bọn chọn một người để cắn.</li>
    <li>🔮 <b>Tiên tri</b>: mỗi đêm soi một người, biết người đó có phải Sói không.</li>
    <li>🛡️ <b>Bảo vệ</b>: mỗi đêm che chở một người (kể cả mình). Sói cắn đúng người đó thì họ vẫn sống.</li>
    <li>🧑‍🌾 <b>Dân làng</b>: không có khả năng đặc biệt, dùng lời nói và lá phiếu.</li>
  </ul>
  <p class="note">${MIN}–5 người có 1 Sói. 6–8 người có 2 Sói và thêm Bảo vệ. 9–${MAX} người có 3 Sói. Luôn có 1 Tiên tri. Phòng ${MIN}–${MAX} người.</p>
  <h3>🔁 Một vòng chơi</h3>
  <ol>
    <li>Vào phòng, nhập tên, bấm <b>Sẵn sàng</b>. Mọi người sẵn sàng thì ván tự bắt đầu. Thiếu người mà chờ ${LOBBY_WAIT} giây không ai vào thì tự thêm người máy.</li>
    <li>Chạm vào thẻ 🎴 để xem vai (đừng cho ai thấy).</li>
    <li>🌙 <b>Ban đêm (${DUR.night} giây)</b>: Sói, Tiên tri, Bảo vệ chọn mục tiêu. Dân làng chờ trời sáng.</li>
    <li>☀️ <b>Ban ngày (${DUR.day} giây)</b>: biết ai chết, thảo luận trong chat để tìm Sói. Muốn sang bước tiếp thì bấm <b>Sẵn sàng bỏ phiếu</b>.</li>
    <li>🗳️ <b>Bỏ phiếu (${DUR.vote} giây)</b>: mỗi người chọn một người để treo cổ. Người nhiều phiếu nhất chết và lộ vai. Hòa phiếu thì không ai chết.</li>
    <li>Lặp lại ban đêm cho đến khi một phe thắng.</li>
  </ol>
  <h3>💬 Chat</h3>
  <ul>
    <li><b>Chung</b>: người còn sống nói chuyện ban ngày.</li>
    <li><b>Sói</b>: chỉ Sói thấy, dùng ban đêm để bàn nhau.</li>
    <li><b>Người chết</b>: chỉ người đã chết thấy. Người chết không được nói vào kênh chung hay tiết lộ vai.</li>
  </ul>
  <h3>💡 Mẹo</h3>
  <ul>
    <li><b>Dân</b>: để ý ai nói quá nhiều, ai im lặng bất thường, ai chỉ bỏ phiếu theo đám đông.</li>
    <li><b>Sói</b>: giả làm dân, đừng bảo vệ đồng bọn quá lộ liễu.</li>
    <li><b>Tiên tri</b>: đừng lộ vai quá sớm, Sói sẽ cắn bạn đầu tiên.</li>
    <li><b>Bảo vệ</b>: đoán xem Sói định cắn ai.</li>
    <li>Lỡ thoát giữa ván? Mở lại link, nhập <b>đúng tên cũ</b> và số phòng để vào lại (nếu mất mạng đột ngột, chờ khoảng 30 giây). Không dùng được tên của người đang chơi.</li>
    <li>Phòng đã đủ người hoặc ván đã bắt đầu? Bạn vào <b>Khán đài</b> 👀: thấy hết vai, hành động và mọi kênh chat, nhưng không chat được. Chủ phòng có thể bật hoặc tắt Khán đài.</li>
  </ul></div></div>`;
}

          ${vi('🛡️', 'Bảo vệ', 'Che chở một người.', 'guard')}${vi('🧑‍🌾', 'Dân làng', 'Tìm Sói bằng lá phiếu.', 'vill')}

      <div class="card"><div class="sec"><span class="yi">★</span>Một vòng chơi</div>

/* ---------- Danh sách người chơi dạng thẻ ---------- */
function playersGrid(withRole, forLobby) {
  const p = S.players || {}, roles = S.roles || {}, host = S.host === me.pid;
  return `<div class="pgrid">${Object.entries(p).sort((a, b) => a[1].t - b[1].t).map(([id, v]) => {
    const tags = (id === S.host ? '<span class="chip" style="height:22px;font-size:11px">chủ phòng</span> ' : '') + (v.bot ? '<span class="chip mute" style="height:22px;font-size:11px">người máy</span>' : '');
    const meta = forLobby ? (v.ready ? '<span class="chip green" style="height:22px;font-size:11px">✅ sẵn sàng</span>' : '<span class="meta">⏳ chưa sẵn sàng</span>')
      : (withRole && roles[id] ? `<span class="meta t-${roles[id]}">${ROLE_NAME[roles[id]]}</span>` : v.alive ? '<span class="meta">còn sống</span>' : '<span class="meta">đã chết</span>');
    const x = forLobby && v.bot && host ? `<button class="x ghost" data-act="rmBot" data-pid="${id}" style="min-height:28px;padding:2px 10px;font-size:12px">Xóa</button>` : '';
    return `<div class="ptile ${v.alive ? '' : 'dead'}">${avatar(v.name)}<div style="min-width:0"><span class="nm">${esc(v.name)}${id === me.pid ? ' (bạn)' : ''}</span>${tags} ${meta}</div>${x}</div>`;
  }).join('')}</div>`;
}

/* ---------- Phòng chờ ---------- */
const specOn = () => !S || S.allowSpec !== false;
const specBtn = () => `<button data-act="toggleSpec" title="Cho phép người vào sau (phòng đầy hoặc đang chơi) ngồi xem">👀 Khán đài: ${specOn() ? 'Bật' : 'Tắt'}</button>`;
function lobbyHTML() {
  const pl = S.players || {}, n = Object.keys(pl).length, host = S.host === me.pid, can = n >= MIN;
  const rdy = Object.values(pl).filter(p => p.ready).length, mineReady = !!(pl[me.pid] && pl[me.pid].ready);
  const hint = !can ? `Cần thêm ${MIN - n} người nữa (tối thiểu ${MIN}).` : rdy === n ? 'Mọi người đã sẵn sàng, đang bắt đầu…' : `Đã sẵn sàng ${rdy}/${n}. Ván tự bắt đầu khi tất cả bấm Sẵn sàng.`;
  return `<div class="cols"><div class="stack">
    ${todoHTML()}
    <div class="card"><div class="note" style="text-align:center">Số phòng</div><div class="code">${esc(me.code)}</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="amber" data-act="invite">📨 Mời bạn bè</button>
        <button class="primary" data-act="lobbyReady" style="min-width:150px">${mineReady ? 'Bỏ sẵn sàng' : '✅ Sẵn sàng'}</button>
        <button class="ghost" data-act="leave">Rời phòng</button>
      </div>
      <p class="note" style="text-align:center;margin-top:10px">${hint}</p>
      <p class="note" id="fillhint" style="text-align:center"></p>
    </div>
    <div class="card"><div class="sec">Người chơi (${n}/${MAX})<span class="r">${rdy} đã sẵn sàng</span></div>${playersGrid(false, true)}
      <div class="row" style="margin-top:12px">
        ${host && n < MAX ? '<button data-act="addBot">🤖 Thêm người máy</button>' : ''}
        ${host ? specBtn() : ''}
        ${host && can && rdy < n ? '<button class="primary" data-act="start">Bắt đầu ngay (chủ phòng)</button>' : ''}
      </div>
    </div>
  </div><div class="stack">${chatHTML()}</div></div>`;
}

function picker(cands, kind, label) {
  const p = S.players;
  return `<div class="card"><div class="sec">${label}</div><div class="pgrid">${cands.map(id => `<button class="ptile ${pick === id ? 'sel' : ''}" data-act="pick" data-pid="${id}">${avatar(p[id].name)}<span class="nm">${esc(p[id].name)}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="primary" data-act="confirm" data-kind="${kind}" style="min-width:160px" ${pick ? '' : 'disabled'}>Xác nhận</button></div></div>`;
}
function todo() {   // một câu nói rõ "bây giờ bạn cần làm gì"
  if (S.phase === 'lobby') {
    const mine = !!(S.players[me.pid] && S.players[me.pid].ready), n = Object.keys(S.players || {}).length;
    return mine ? ['Đã sẵn sàng. Đang chờ mọi người…', true] : [n < MIN ? 'Bấm “Sẵn sàng”. Rủ thêm bạn bè bằng nút “Mời bạn bè” bên dưới.' : 'Bấm “Sẵn sàng” khi bạn chuẩn bị xong.', false];
  }
  const p = S.players || {}, roles = S.roles || {}, my = roles[me.pid], alive = p[me.pid] && p[me.pid].alive;
  if (S.phase === 'end') return ['🏁 Hết ván! Bấm “Chơi ván mới” để chơi tiếp.', false];
  if (!alive) return ['💀 Bạn đã chết. Cứ xem tiếp, và đừng tiết lộ vai của ai.', true];
  if (S.phase === 'night') {
    const n = S.night || {};
    if (my === 'wolf') return (n.wolf || {})[me.pid] ? ['Đã chọn xong. Chờ mọi người…', true] : ['🐺 Chọn một người để cắn.', false];
    if (my === 'seer') return n.seer ? ['Đã soi xong. Kết quả có vào sáng mai.', true] : ['🔮 Chọn một người để soi xem có phải Sói không.', false];
    if (my === 'guard') return n.guard ? ['Đã chọn xong. Chờ trời sáng…', true] : ['🛡️ Chọn một người để bảo vệ đêm nay.', false];
    return ['😴 Trời tối rồi, bạn đi ngủ. Chờ trời sáng nhé.', true];
  }
  if (S.phase === 'day') return (S.ready || {})[me.pid] ? ['Đã sẵn sàng. Chờ mọi người…', true] : ['☀️ Nói chuyện trong khung chat để tìm Sói. Xong thì bấm “Sẵn sàng bỏ phiếu”.', false];
  if (S.phase === 'vote') return (S.votes || {})[me.pid] ? ['Đã bỏ phiếu. Chờ mọi người…', true] : ['🗳️ Chọn người bạn nghĩ là Sói rồi bấm “Xác nhận”.', false];
  return ['', true];
}
const todoHTML = () => { const [t, dim] = todo(); return t ? `<div class="todo ${dim ? 'dim' : ''}">${t}</div>` : ''; };
async function invite() {
  const cx = game === 'caro' ? cme : me;
  const url = location.origin + location.pathname + '?game=' + game + '&room=' + encodeURIComponent(cx.code);
  const text = `Vào chơi ${game === 'caro' ? 'cờ caro' : 'Ma sói'} với mình nhé! Số phòng: ${cx.code}\n${url}`;
  try { if (navigator.share) { await navigator.share({ title: 'Ma sói', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  inviteText = '';
  try { await navigator.clipboard.writeText(text); inviteMsg = '✅ Đã sao chép! Dán vào Zalo, Messenger… để mời bạn bè.'; }
  catch (e) { inviteMsg = 'Chọn và sao chép lời mời này rồi gửi cho bạn bè:'; inviteText = text; }
  render(); setTimeout(() => { inviteMsg = ''; inviteText = ''; if (S) render(); }, inviteText ? 20000 : 4000);
}

/* ---------- Màn hình người xem ---------- */
function specHTML() {
  const p = S.players || {}, roles = S.roles || {}, nm = id => (p[id] ? esc(p[id].name) : '?');
  const alive = Object.keys(p).filter(id => p[id].alive), specs = Object.values(S.spectators || {});
  const PH = { lobby: ['⏳ Phòng chờ', 'mute'], night: ['🌙 Ban đêm', 'mute'], day: ['☀️ Ban ngày', 'amber'], vote: ['🗳️ Bỏ phiếu', 'red'], end: ['🏁 Kết thúc', 'green'] }[S.phase];
  const why = me.why === 'full' ? `Phòng đã đủ ${MAX} người nên bạn vào Khán đài.` : me.why === 'started' ? 'Ván đã bắt đầu nên bạn vào Khán đài.' : 'Bạn đang ở Khán đài.';
  let out = `<div class="status"><span class="chip ${PH[1]}">${PH[0]}</span>${S.phase !== 'lobby' ? `<span class="chip mute">Đêm thứ ${S.round}</span>` : ''}<span class="chip" id="cd"></span><span class="chip mute">${alive.length}/${Object.keys(p).length} còn sống</span></div>`;
  out += `<div class="todo">👀 ${why} Khán giả thấy hết vai và hành động của mọi người nhưng không chat được.</div>`;
  if (S.announce) out += `<div class="card ann">${esc(S.announce).replace(/\n/g, '<br>')}</div>`;
  if (S.winner) out += `<div class="card ann"><b>${esc(S.winner)}</b></div>`;
  if (S.phase === 'night') {
    const n = S.night || {}, wv = Object.entries(n.wolf || {});
    out += `<div class="card"><div class="sec">Hành động đêm nay</div>
      <div>🐺 Sói: ${wv.length ? wv.map(([id, t]) => `${nm(id)} cắn ${nm(t)}`).join('; ') : '<span class="note">chưa chọn</span>'}</div>
      <div>🔮 Tiên tri: ${n.seer ? 'soi ' + nm(n.seer) : '<span class="note">chưa chọn</span>'}</div>
      <div>🛡️ Bảo vệ: ${n.guard ? 'bảo vệ ' + nm(n.guard) : '<span class="note">chưa chọn</span>'}</div></div>`;
  } else if (S.phase === 'day') {
    const rd = S.ready || {};
    out += `<div class="card"><div class="sec">Sẵn sàng bỏ phiếu</div>${alive.filter(id => rd[id]).length}/${alive.length} người đã sẵn sàng</div>`;
  } else if (S.phase === 'vote') {
    const v = Object.entries(S.votes || {});
    out += `<div class="card"><div class="sec">Phiếu bầu (${v.length}/${alive.length})</div>${v.length ? v.map(([id, t]) => `<div>${nm(id)} → ${nm(t)}</div>`).join('') : '<span class="note">chưa ai bỏ phiếu</span>'}</div>`;
  }
  if (S.seerLog) out += `<div class="card"><div class="sec">🔮 Kết quả soi</div>${Object.keys(S.seerLog).sort((a, b) => a - b).map(k => `<div>${esc(S.seerLog[k])}</div>`).join('')}</div>`;
  out += `<div class="card"><div class="sec">Người chơi<span class="r">thấy cả vai</span></div>${playersGrid(S.phase !== 'lobby', S.phase === 'lobby')}</div>`;
  out += `<div class="card"><div class="sec">👀 Khán đài (${specs.length} khán giả)</div>${specs.map(x => esc(x.name)).join(', ')}</div>`;
  return `<div class="cols"><div class="stack">${out}</div><div class="stack">${chatHTML()}<button class="ghost" data-act="leave">Rời phòng</button></div></div>`;
}

/* ---------- Màn hình ván chơi ---------- */
function gameHTML() {
  const p = S.players || {}, roles = S.roles || {}, myRole = roles[me.pid], iAlive = p[me.pid] && p[me.pid].alive;
  const alive = Object.keys(p).filter(id => p[id].alive);
  const PH = { night: ['🌙 Ban đêm', 'mute'], day: ['☀️ Ban ngày', 'amber'], vote: ['🗳️ Bỏ phiếu', 'red'], end: ['🏁 Kết thúc', 'green'] }[S.phase];
  let out = `<div class="status"><span class="chip ${PH[1]}">${PH[0]}</span><span class="chip mute">Đêm thứ ${S.round}</span><span class="chip" id="cd"></span><span class="chip mute">${alive.length}/${Object.keys(p).length} còn sống</span>${Object.keys(S.spectators || {}).length ? `<span class="chip mute">👀 ${Object.keys(S.spectators).length} khán giả</span>` : ''}</div>`;
  out += todoHTML();
  out += `<div class="card role ${showRole && myRole ? myRole : ''} ${!roleSeen && myRole ? 'pulse' : ''}" data-act="toggleRole">${showRole && myRole
    ? `<div class="note">Vai của bạn</div><div class="big t-${myRole}">${ROLE_NAME[myRole]}</div><div class="note">${ROLE_HINT[myRole]}</div><div class="note" style="margin-top:6px">(bấm để ẩn)</div>`
    : `<div class="note">${roleSeen ? 'Bấm để xem lại vai (đừng cho người khác thấy)' : '👆 Bấm vào đây để xem vai của bạn (đừng cho người khác thấy)'}</div><div class="big">🎴</div>`}</div>`;
  if (S.announce) out += `<div class="card ann">${esc(S.announce).replace(/\n/g, '<br>')}</div>`;
  if (myRole === 'seer' && S.seerLog) out += `<div class="card"><div class="sec">🔮 Kết quả soi</div>${Object.keys(S.seerLog).sort((a, b) => a - b).map(k => `<div>${esc(S.seerLog[k])}</div>`).join('')}</div>`;

  if (S.phase === 'night') {
    const n = S.night || {}, wv = n.wolf || {};
    if (!iAlive) out += '<div class="card note">Bạn đã chết. Hãy xem tiếp trong im lặng.</div>';
    else if (myRole === 'wolf') {
      const mates = Object.keys(roles).filter(id => roles[id] === 'wolf' && id !== me.pid && p[id]);
      out += `<div class="card note">Đồng bọn: ${mates.length ? mates.map(id => esc(p[id].name)).join(', ') : 'không có (bạn là Sói duy nhất)'}</div>`;

        : picker(alive.filter(id => roles[id] !== 'wolf'), 'wolf', 'Chọn người để cắn');
    } else if (myRole === 'seer') out += n.seer ? `<div class="card">Bạn đã soi <b>${esc(p[n.seer].name)}</b>. Kết quả có vào sáng mai.</div>` : picker(alive.filter(id => id !== me.pid), 'seer', 'Chọn người để soi');

    if (!iAlive) out += '<div class="card note">Bạn đã chết, không được bỏ phiếu.</div>';
    else out += v[me.pid] ? `<div class="card">Bạn đã bỏ phiếu cho <b>${esc(p[v[me.pid]].name)}</b>.</div>` : picker(alive.filter(id => id !== me.pid), 'vote', 'Bỏ phiếu treo cổ');
    out += `<p class="note" style="text-align:center">Đã bỏ phiếu: ${cnt}/${alive.length}</p>`;
  } else if (S.phase === 'end') {
    out += `<div class="card ann"><b>${esc(S.winner || '')}</b><div class="row" style="justify-content:center;margin-top:12px"><button class="primary" data-act="again" style="min-width:180px">Chơi ván mới</button></div></div>`;
  }
  out += `<div class="card"><div class="sec">Người chơi</div>${playersGrid(S.phase === 'end', false)}</div>`;
  return `<div class="cols"><div class="stack">${out}</div><div class="stack">${chatHTML()}${S.host === me.pid ? specBtn() : ''}<button class="ghost" data-act="leave">Thoát khỏi phòng</button></div></div>`;
}

/* ============ Chat ============ */
function chatTabs() {
  if (me.spec) return S.phase === 'lobby' ? [['day', 'Chung']] : [['day', 'Chung'], ['wolf', 'Sói'], ['dead', 'Người chết']];
  const p = S.players || {}, mine = (S.roles || {})[me.pid], alive = p[me.pid] && p[me.pid].alive;
  const t = [['day', 'Chung']];
  if (mine === 'wolf') t.push(['wolf', 'Sói']);
  if (!alive) t.push(['dead', 'Người chết']);
  return t;
}
function chatRule(ch) {   // trả về '' nếu được viết, ngược lại là lý do
  if (me.spec) return 'Khán giả không chat được.';
  const p = S.players || {}, mine = (S.roles || {})[me.pid], alive = p[me.pid] && p[me.pid].alive, ph = S.phase;
  if (ph === 'lobby') return ch === 'day' ? '' : 'Kênh này chưa mở.';   // phòng chờ: ai cũng chat được để rủ nhau bắt đầu
  if (ch === 'day') {
    if (ph === 'end') return '';
    if (!alive) return 'Bạn đã chết, hãy dùng kênh Người chết.';
    if (ph === 'night') return 'Ban đêm không ai được nói chuyện (trừ Sói ở kênh Sói).';
    return '';
  }
  if (ch === 'wolf') {
    if (mine !== 'wolf') return 'Chỉ Sói dùng kênh này.';
    if (ph === 'end') return '';
    if (!alive) return 'Bạn đã chết.';
    return ph === 'night' ? '' : 'Kênh Sói chỉ mở ban đêm.';
  }
  if (ch === 'dead') return alive && ph !== 'end' ? 'Chỉ người đã chết dùng kênh này.' : '';
  return 'Kênh không hợp lệ.';
}
const CH_NAME = { day: 'Chung', wolf: 'Sói', dead: 'Người chết' };
function chatSees(ch) {   // kênh nào mình được đọc
  if (ch === 'day' || me.spec || S.phase === 'end') return true;
  if (ch === 'wolf') return (S.roles || {})[me.pid] === 'wolf';
  if (ch === 'dead') { const p = (S.players || {})[me.pid]; return !!p && !p.alive; }
  return false;
}

/* ============ Cờ caro (2 người, bàn 15×15, đủ 5 ô liền thì thắng) ============ */
const CARO_SIZE = 15, CARO_WIN = 5;
const ck = (r, c) => r + '_' + c;
const cbase = () => 'caro/' + cme.code + '/';
function caroWinLine(board, r, c, mark) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [ck(r, c)];
    for (const sgn of [1, -1]) {
      let rr = r + dr * sgn, cc = c + dc * sgn;
      while (rr >= 0 && rr < CARO_SIZE && cc >= 0 && cc < CARO_SIZE && board[ck(rr, cc)] === mark) { line.push(ck(rr, cc)); rr += dr * sgn; cc += dc * sgn; }
    }
    if (line.length >= CARO_WIN) return line;
  }
  return null;
}
/* ---- Tài khoản cờ caro: tên + mật khẩu (băm PBKDF2), tên không được trùng ---- */
const NAME_RE = /^[\p{L}\p{N}_ ]{2,16}$/u;
const nameKey = n => n.normalize('NFC').toLowerCase().trim().replace(/\s+/g, '_');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function hashPw(pw, saltB64) {
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, key, 256);
  return { salt: b64(salt), hash: b64(bits) };
}
function setAuth(u) { auth = u; authPass = ''; authErr = ''; store().setItem('caro_auth', JSON.stringify(u)); render(); }
function authFail(m) { authErr = m; authBusy = false; render(); }
async function caroRegister() {
  if (authBusy) return; const name = authName.trim().replace(/\s+/g, ' ');
  if (!NAME_RE.test(name)) return authFail('Tên gồm 2 đến 16 ký tự: chữ, số, dấu gạch dưới hoặc khoảng trắng.');
  if (authPass.length < 4) return authFail('Mật khẩu cần ít nhất 4 ký tự.');
  authBusy = true; const key = nameKey(name);
  if (await B.get('users/' + key)) return authFail('Tên "' + name + '" đã có người dùng. Hãy chọn tên khác (tên không phân biệt hoa thường).');
  const { salt, hash } = await hashPw(authPass);
  await B.set('users/' + key, { name, salt, hash, createdAt: Date.now() });
  await B.set('scores/' + key, { name, win: 0, loss: 0, draw: 0, games: 0 });
  authBusy = false; rankData = null; setAuth({ key, name, hash });
}
async function caroLogin() {
  if (authBusy) return; const name = authName.trim().replace(/\s+/g, ' ');
  if (!name || !authPass) return authFail('Nhập tên và mật khẩu.');
  authBusy = true; const key = nameKey(name), u = await B.get('users/' + key);
  if (!u) return authFail('Tên hoặc mật khẩu không đúng. Chưa có tài khoản thì bấm Đăng ký.');
  const { hash } = await hashPw(authPass, u.salt);
  if (hash !== u.hash) return authFail('Tên hoặc mật khẩu không đúng.');
  authBusy = false; setAuth({ key, name: u.name, hash });
}
async function caroLogout() { if (cme) await caroLeave(); auth = null; store().removeItem('caro_auth'); rankData = null; render(); }
async function resumeAuth() {   // vào lại trang: kiểm tra phiên đăng nhập đã lưu

  if (u && u.hash === saved.hash) auth = { key: saved.key, name: u.name, hash: u.hash }; else store().removeItem('caro_auth');
}

async function caroRecord(players, winner) {   // ghi thành tích sau khi ván kết thúc (do máy của người đi nước cuối ghi)
  const upd = {};
  for (const id of Object.keys(players)) {
    const sc = (await B.get('scores/' + id)) || { win: 0, loss: 0, draw: 0, games: 0 };
    const res = winner === 'draw' ? 'draw' : winner === players[id].mark ? 'win' : 'loss';
    sc.name = players[id].name; sc[res] = (sc[res] || 0) + 1; sc.games = (sc.games || 0) + 1; upd['scores/' + id] = sc;
  }
  await B.update(upd); rankData = null;
}
async function caroJoin() {   // phòng có sẵn thì vào, chưa có thì tạo; người thứ hai vào là bắt đầu luôn. Định danh trong phòng = khóa tài khoản
  if (!auth) return authFail('Hãy đăng nhập trước.');
  const name = auth.name, pid = auth.key, code = homeCode.replace(/\s+/g, '').toUpperCase();
  if (!CODE_RE.test(code)) return setErr('Số phòng gồm 2 đến 8 chữ hoặc số (không dấu, không ký tự đặc biệt).');
  homeCode = code;
  const room = await B.get('caro/' + code), now = Date.now();
  if (!room) {
    await B.set('caro/' + code, { host: pid, phase: 'wait', createdAt: now, players: { [pid]: { name, t: now } }, seen: { [pid]: now } });
    return caroEnter({ pid, name, code });
  }
  const players = room.players || {}, ids = Object.keys(players);
  if (players[pid]) return caroEnter({ pid, name, code });                                   // đã là người chơi trong phòng: vào lại
  if ((room.spectators || {})[pid]) return caroEnter({ pid, name, code, spec: true });      // đã là khán giả
  if (ids.length < 2) {   // người thứ hai: chọn ngẫu nhiên X/O rồi bắt đầu
    const xFirst = Math.random() < 0.5, first = ids[0];
    await B.update({
      ['caro/' + code + '/players/' + first + '/mark']: xFirst ? 'X' : 'O',
      ['caro/' + code + '/players/' + pid]: { name, t: now, mark: xFirst ? 'O' : 'X' },
