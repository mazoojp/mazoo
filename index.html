import { ROLE_NAME, MIN, MAX, DUR, DAY_OPTIONS, durOf, AGAIN_LOCK, LOBBY_WAIT, BOT_NAMES, stepRoom, lobbyFillAt } from './rules.js?v=20261126o';

/* ============ Backend: Firebase Realtime Database hoặc chế độ thử (localStorage) ============ */
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));

function localBackend() {
  const KEY = 'masoi_local_db';
  let data = JSON.parse(localStorage.getItem(KEY) || '{}');
  const watchers = [];
  const keys = p => p.split('/').filter(Boolean);
  const getp = p => { let o = data; for (const k of keys(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; };
  const setp = (p, v) => {
    const ks = keys(p); let o = data;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  };
  const save = () => localStorage.setItem(KEY, JSON.stringify(data));
  const notify = () => watchers.slice().forEach(w => w.cb(clone(getp(w.p))));
  window.addEventListener('storage', e => { if (e.key === KEY) { data = JSON.parse(e.newValue || '{}'); notify(); } });
  return {
    mode: 'local',
    onDisc: () => {},
    get: async p => clone(getp(p)),
    set: async (p, v) => { setp(p, v); save(); notify(); },
    update: async u => { for (const [p, v] of Object.entries(u)) setp(p, v); save(); notify(); },
    watch: (p, cb) => { const w = { p, cb }; watchers.push(w); cb(clone(getp(p))); return () => { const i = watchers.indexOf(w); if (i >= 0) watchers.splice(i, 1); }; },

async function makeBackend() {

    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const m = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
    const db = m.getDatabase(initializeApp(cfg));
    m.onValue(m.ref(db, '.info/serverTimeOffset'), s => { TOFF = s.val() || 0; });   // lệch giữa đồng hồ máy này và máy chủ Firebase
    return {

      set: (p, v) => m.set(m.ref(db, p), v),

      watch: (p, cb) => m.onValue(m.ref(db, p), s => cb(s.val())),

      pruneOld: async (p, cutoff) => {   // xoá tối đa 30 tin cũ nhất đã quá hạn (luật chỉ cho xoá tin quá hạn)

  const it = (act, icon, label, on = false) => `<button class="it ${on ? 'on' : ''}" data-act="${act}" title="${label}">${ic(icon)}<span>${label}</span></button>`;
  const gt = (g, icon, label) => `<button class="it ${game === g ? 'on' : ''}" data-act="go" data-game="${g}" title="${label}">${ic(icon)}<span>${label}</span></button>`;
  const logo = caro ? '<span class="logo"><span class="m">cờ</span><span class="o" style="font-size:11px">XO</span><span class="s">caro</span></span>'
    : '<span class="logo"><span class="m">ma</span><span class="o">狼</span><span class="s">sói</span></span>';
  return `<div class="shell">

      ${gt('caro', 'grid', 'Cờ caro')}
      ${gt('gchat', 'chat', 'Chat tổng')}
      ${nguOn() ? gt('ngu', 'moon', 'Ngủ đêm') : ''}
      ${gt('menu', 'ramen', 'Thực đơn')}
      ${donateOn() ? gt('donate', 'ramen', 'Ủng hộ 1 bát ramen') : ''}
      <div class="sep"></div>
      ${it('home', 'home', inRoom ? 'Rời phòng' : 'Trang chủ', !inRoom)}
      ${inRoom && !caro ? it('goChat', 'chat', 'Chat') : ''}
      ${caro ? it('rank', 'trophy', 'Xếp hạng', showRank) : ''}
      ${it('help', 'book', 'Cách chơi', showHelp)}
      ${inRoom ? it('invite', 'send', 'Mời bạn bè') : ''}
      <div class="sp"></div>
      ${it('help', 'info', 'Luật chơi')}
    </aside>
    <div class="content">
      <header class="topbar">
        ${logo}<span class="greet">${cx ? 'Chào ' + esc(cx.name) + '!' : 'Chào bạn!'}</span>
        <span class="spacer"></span>
        ${B.mode === 'firebase' ? `<span class="chip green" title="Số người đang mở trang web">🟢 <span class="onlinecnt">${onlineN}</span> online</span>` : ''}
        ${inRoom ? `<span class="chip">Phòng ${esc(cx.code)}</span>` : ''}
        ${inRoom ? '<button class="primary tb hide" data-act="invite">Mời bạn bè</button>' : ''}
        <button class="tb" data-act="help" style="background:var(--pri-soft);color:var(--pri)">Cách chơi</button>
        ${cx ? `<span class="user">${avatar(cx.name, '', game === 'caro' ? cx.pid : '')}</span>` : ''}
      </header>
      <main class="page">${notices}${inner}</main>

}
function caroHelpHTML() {

  <h3>⭕ Cờ caro là gì?</h3><p>Hai người đánh luân phiên trên bàn ${CARO_SIZE}×${CARO_SIZE}: một người đánh <b style="color:#1371E2">X</b>, người kia đánh <b style="color:#EC4920">O</b>.</p>
  <h3>🎯 Cách thắng</h3><p>Ai xếp được <b>${CARO_WIN} ô liền nhau</b> (hàng ngang, hàng dọc hoặc đường chéo) trước thì thắng. Bàn đầy mà chưa ai thắng thì hòa.</p>
  <h3>🔁 Cách chơi</h3>
  <ol><li><b>Đăng ký</b> (tên + mật khẩu, tên không được trùng) hoặc đăng nhập. Thắng 3 điểm, hòa 1 điểm, thành tích lưu theo tên và xếp trên 🏆 bảng xếp hạng.</li><li>Nhập số phòng, bấm <b>Vào phòng</b>. Phòng chưa có thì tạo mới, gửi số phòng cho bạn bè.</li>
  <li>Khi người thứ hai vào, ván tự bắt đầu và hệ thống chọn ngẫu nhiên ai là X (X đi trước).</li>
  <li>Đến lượt bạn thì bấm vào một ô trống. Ô vừa đánh gần nhất có viền vàng.</li>

}
function helpHTML() {
  if (game === 'caro') return caroHelpHTML();
  return `<div class="modal" data-act="helpBg"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="sec" style="margin:0">📖 Cách chơi</div><button data-act="help">Đóng</button></div>
  <h3>🐺 Ma sói là gì?</h3>
  <p>Trò chơi suy luận nhóm. Trong làng có vài <b>Sói</b> giả làm dân thường. Dân làng không biết ai là Sói, còn Sói biết nhau. Ban đêm Sói lén cắn chết một người. Ban ngày cả làng thảo luận rồi bỏ phiếu treo cổ người bị nghi là Sói. Bạn không cần biết chơi trước, chỉ cần xem vai của mình và làm theo hướng dẫn trên màn hình.</p>
  <h3>🎯 Mục tiêu</h3>
  <p><b>Dân làng</b> thắng khi giết hết Sói. <b>Sói</b> thắng khi số Sói bằng hoặc nhiều hơn số người còn lại.</p>
  <h3>🎴 Các vai</h3>
  <ul>
    <li>🐺 <b>Sói</b>: mỗi đêm cùng đồng bọn chọn một người để cắn.</li>
    <li>🔮 <b>Tiên tri</b>: mỗi đêm soi một người, biết người đó có phải Sói không.</li>
    <li>🛡️ <b>Bảo vệ</b>: mỗi đêm che chở một người (kể cả mình). Sói cắn đúng người đó thì họ vẫn sống.</li>
    <li>🧑‍🌾 <b>Dân làng</b>: không có khả năng đặc biệt, dùng lời nói và lá phiếu.</li>
  </ul>
  <p class="note">${MIN}–5 người có 1 Sói. 6–8 người có 2 Sói và thêm Bảo vệ. 9–${MAX} người có 3 Sói. Luôn có 1 Tiên tri. Phòng ${MIN}–${MAX} người.</p>
  <h3>🔁 Một vòng chơi</h3>
  <ol>
    <li>Vào phòng, nhập tên, bấm <b>Sẵn sàng</b>. Mọi người sẵn sàng thì ván tự bắt đầu. Thiếu người mà chờ ${LOBBY_WAIT} giây không ai vào thì tự thêm người máy.</li>
    <li>Chạm vào thẻ 🎴 để xem vai (đừng cho ai thấy).</li>
    <li>🌙 <b>Ban đêm (${DUR.night} giây)</b>: Sói, Tiên tri, Bảo vệ chọn mục tiêu. Dân làng chờ trời sáng.</li>
    <li>🌅 <b>Mở đầu ván</b>: ván bắt đầu bằng một buổi sáng để mọi người làm quen và trò chuyện (chưa ai chết, chưa bỏ phiếu), hết giờ hoặc mọi người sẵn sàng thì trời tối, Đêm 1 bắt đầu.</li>
    <li>☀️ <b>Ban ngày (mặc định ${DUR.day} giây, chủ phòng chỉnh được 1–10 phút)</b>: biết ai chết, thảo luận trong chat để tìm Sói. Muốn sang bước tiếp thì bấm <b>Sẵn sàng bỏ phiếu</b>.</li>
    <li>🗳️ <b>Bỏ phiếu (${DUR.vote} giây)</b>: mỗi người chọn một người để treo cổ. Người nhiều phiếu nhất chết và lộ vai (trừ khi chủ phòng tắt “Lộ vai khi chết” ở phòng chờ). Hòa phiếu thì không ai chết.</li>
    <li>Lặp lại ban đêm cho đến khi một phe thắng.</li>
  </ol>
  <h3>💬 Chat</h3>
  <ul>
    <li><b>Chung</b>: người còn sống nói chuyện ban ngày.</li>
    <li><b>Sói</b>: chỉ Sói thấy, dùng ban đêm để bàn nhau.</li>
    <li><b>Người chết</b>: chỉ người đã chết thấy. Người chết không được nói vào kênh chung hay tiết lộ vai.</li>
  </ul>
  <h3>💡 Mẹo</h3>
  <ul>
    <li><b>Dân</b>: để ý ai nói quá nhiều, ai im lặng bất thường, ai chỉ bỏ phiếu theo đám đông.</li>
    <li><b>Sói</b>: giả làm dân, đừng bảo vệ đồng bọn quá lộ liễu.</li>
    <li><b>Tiên tri</b>: đừng lộ vai quá sớm, Sói sẽ cắn bạn đầu tiên.</li>
    <li><b>Bảo vệ</b>: đoán xem Sói định cắn ai.</li>
    <li>Lỡ thoát giữa ván? Mở lại link, nhập <b>đúng tên cũ</b> và số phòng để vào lại (nếu mất mạng đột ngột, chờ khoảng 30 giây). Không dùng được tên của người đang chơi.</li>
    <li>Phòng đã đủ người hoặc ván đã bắt đầu? Bạn vào <b>Khán đài</b> 👀: thấy diễn biến ván và các khung chat (khung Sói chỉ hiện “Sói 1, Sói 2…”), không thấy vai hay hành động bí mật, và không chat được. Chủ phòng có thể bật hoặc tắt Khán đài.</li>
  </ul></div></div>`;
}

/* ---------- Danh sách người chơi dạng thẻ ---------- */
function playersGrid(withRole, forLobby) {
  const p = S.players || {}, roles = S.roles || {}, host = S.host === me.pid;
  const iAmDead = !forLobby && !me.spec && !!p[me.pid] && !p[me.pid].alive;   // người đã chết thấy vai của tất cả; ai chết thì vai được công khai
  return `<div class="pgrid">${Object.entries(p).sort((a, b) => a[1].t - b[1].t).map(([id, v]) => {
    const tags = (id === S.host ? '<span class="chip" style="height:22px;font-size:11px">chủ phòng</span> ' : '') + (v.bot ? '<span class="chip mute" style="height:22px;font-size:11px">người máy</span>' : '');
    const meta = forLobby ? (v.ready ? '<span class="chip green" style="height:22px;font-size:11px">✅ sẵn sàng</span>' : '<span class="meta">⏳ chưa sẵn sàng</span>')
      : ((withRole || (!v.alive && !S.hideRoles) || iAmDead || (!forLobby && !me.spec && roles[me.pid] === 'wolf' && roles[id] === 'wolf')) && roles[id] ? `<span class="meta t-${roles[id]}">${ROLE_NAME[roles[id]]}${v.alive ? '' : ' · đã chết'}</span>` : v.alive ? '<span class="meta">còn sống</span>' : '<span class="meta">đã chết</span>');
    const x = forLobby && v.bot && host ? `<button class="x ghost" data-act="rmBot" data-pid="${id}" style="min-height:28px;padding:2px 10px;font-size:12px">Xóa</button>` : '';
    return `<div class="ptile ${v.alive ? '' : 'dead'}">${avatar(v.name)}<div style="min-width:0"><span class="nm">${esc(v.name)}${id === me.pid ? ' (bạn)' : ''}</span>${tags} ${meta}</div>${x}</div>`;
  }).join('')}</div>`;
}

/* ---------- Phòng chờ ---------- */
const specOn = () => !S || S.allowSpec !== false;
const fmtSec = n => n % 60 ? n + ' giây' : n / 60 + ' phút';
const dayBtn = () => `<button data-act="cycleDay" title="Bấm để đổi thời gian thảo luận ban ngày (chỉ chủ phòng, ở phòng chờ)">☀️ Thảo luận: ${fmtSec(durOf(S, 'day'))}</button>`;
const hideBtn = () => `<button data-act="toggleHide" title="Luật gốc: người chết lộ vai. Tắt đi thì vai người chết được giữ kín đến hết ván (căng hơn)">🎭 Lộ vai khi chết: ${S && S.hideRoles ? 'Tắt' : 'Bật'}</button>`;
const specBtn = () => `<button data-act="toggleSpec" title="Cho phép người vào sau (phòng đầy hoặc đang chơi) ngồi xem">👀 Khán đài: ${specOn() ? 'Bật' : 'Tắt'}</button>`;
function lobbyHTML() {
  const pl = S.players || {}, n = Object.keys(pl).length, host = S.host === me.pid, can = n >= MIN;
  const rdy = Object.values(pl).filter(p => p.ready).length, mineReady = !!(pl[me.pid] && pl[me.pid].ready);
  const hint = !can ? `Cần thêm ${MIN - n} người nữa (tối thiểu ${MIN}).` : rdy === n ? 'Mọi người đã sẵn sàng, đang bắt đầu…' : `Đã sẵn sàng ${rdy}/${n}. Ván tự bắt đầu khi tất cả bấm Sẵn sàng.`;
  return `<div class="cols"><div class="stack">
    ${todoHTML()}
    <div class="card"><div class="note" style="text-align:center">Số phòng</div><div class="code">${esc(me.code)}</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="amber" data-act="invite">📨 Mời bạn bè</button>
        <button class="primary" data-act="lobbyReady" style="min-width:150px">${mineReady ? 'Bỏ sẵn sàng' : '✅ Sẵn sàng'}</button>
        <button class="ghost" data-act="leave">Rời phòng</button>
      </div>
      <p class="note" style="text-align:center;margin-top:10px">${hint}</p>
      <p class="note" id="fillhint" style="text-align:center"></p>
      <p class="note" style="text-align:center">☀️ Thảo luận ban ngày: <b>${fmtSec(durOf(S, 'day'))}</b> · 🎭 Khi chết: ${S.hideRoles ? 'KHÔNG lộ vai (chế độ căng)' : 'lộ vai (luật gốc)'}</p>
    </div>
    <div class="card"><div class="sec">Người chơi (${n}/${MAX})<span class="r">${rdy} đã sẵn sàng</span></div>${playersGrid(false, true)}
      <div class="row" style="margin-top:12px">
        ${host && n < MAX ? '<button data-act="addBot">🤖 Thêm người máy</button>' : ''}
        ${host ? specBtn() + hideBtn() + dayBtn() : ''}
        ${host && can && rdy < n ? '<button class="primary" data-act="start">Bắt đầu ngay (chủ phòng)</button>' : ''}
      </div>
    </div>
  </div><div class="stack">${chatHTML()}</div></div>`;
}

function picker(cands, kind, label) {
  const p = S.players;
  return `<div class="card"><div class="sec">${label}</div><div class="pgrid">${cands.map(id => `<button class="ptile ${pick === id ? 'sel' : ''}" data-act="pick" data-pid="${id}">${avatar(p[id].name)}<span class="nm">${esc(p[id].name)}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="primary" data-act="confirm" data-kind="${kind}" style="min-width:160px" ${pick ? '' : 'disabled'}>Xác nhận</button></div></div>`;
}
function todo() {   // một câu nói rõ "bây giờ bạn cần làm gì"

  }
  const p = S.players || {}, roles = S.roles || {}, my = roles[me.pid], alive = p[me.pid] && p[me.pid].alive;

  if (S.phase === 'night') {

    if (my === 'wolf') return (n.wolf || {})[me.pid] ? ['Đã chọn xong. Chờ mọi người…', true] : ['🐺 Chọn một người để cắn.', false];
    if (my === 'seer') return n.seer ? ['Đã soi xong. Kết quả có vào sáng mai.', true] : ['🔮 Chọn một người để soi xem có phải Sói không.', false];
    if (my === 'guard') return n.guard ? ['Đã chọn xong. Chờ trời sáng…', true] : ['🛡️ Chọn một người để bảo vệ đêm nay.', false];

const todoHTML = () => { const [t, dim] = todo(); return t ? `<div class="todo ${dim ? 'dim' : ''}">${t}</div>` : ''; };
async function invite() {

  try { if (navigator.share) { await navigator.share({ title: 'Ma sói', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }

/* ---------- Màn hình người xem ---------- */
function specHTML() {

  out += `<div class="todo">👀 ${why} Khán giả thấy diễn biến ván và các khung chat (khung Sói chỉ hiện “Sói 1, Sói 2…”, không hiện tên thật), không thấy vai của người đang chơi hay hành động bí mật, và không chat được.</div>`;
  if (S.announce) out += `<div class="card ann">${esc(S.announce).replace(/\n/g, '<br>')}</div>`;

}
function gameHTML() {
  const p = S.players || {}, roles = S.roles || {}, myRole = roles[me.pid], iAlive = p[me.pid] && p[me.pid].alive;

  out += rolesSummary() + todoHTML() + recapHTML();   // dòng "ván này có" cố định trên cùng; diễn biến (khi đã có) nằm trên thẻ vai và cập nhật ngay trong lúc chơi
  const roleCard = `<div class="card role ${showRole && myRole ? myRole : ''} ${!roleSeen && myRole ? 'pulse' : ''}" data-act="toggleRole">${showRole && myRole

  if (!S.log) out += roleCard;   // đầu ván (chưa có diễn biến): thẻ vai nằm trên; sau đó xuống dưới cùng

  if (S.log) out += roleCard;
  return `<div class="cols"><div class="stack">${out}</div><div class="stack">${chatHTML()}${S.host === me.pid ? specBtn() : ''}${S.phase === 'end' ? '' : '<button class="ghost" data-act="leave">Thoát khỏi phòng</button>'}</div></div>`;
}

/* ============ Chat ============ */
function chatTabs() {
  if (me.spec) return S.phase === 'lobby' ? [['day', 'Chung']] : [['day', 'Chung'], ['wolf', 'Sói'], ['dead', 'Người chết']];
  const p = S.players || {}, mine = (S.roles || {})[me.pid], alive = p[me.pid] && p[me.pid].alive;
  const t = [['day', 'Chung']];
  if (mine === 'wolf') t.push(['wolf', 'Sói']);
  if (!alive) t.push(['dead', 'Người chết']);
  return t;
}
function chatRule(ch) {   // trả về '' nếu được viết, ngược lại là lý do
  if (me.spec) return 'Khán giả không chat được.';
  const p = S.players || {}, mine = (S.roles || {})[me.pid], alive = p[me.pid] && p[me.pid].alive, ph = S.phase;
  if (ph === 'lobby') return ch === 'day' ? '' : 'Kênh này chưa mở.';   // phòng chờ: ai cũng chat được để rủ nhau bắt đầu
  if (ch === 'day') {
    if (ph === 'end') return '';
    if (!alive) return 'Bạn đã chết, hãy dùng kênh Người chết.';
    if (ph === 'night') return 'Ban đêm không ai được nói chuyện (trừ Sói ở kênh Sói).';
    return '';
  }
  if (ch === 'wolf') {
    if (mine !== 'wolf') return 'Chỉ Sói dùng kênh này.';
    if (ph === 'end') return '';
    if (!alive) return 'Bạn đã chết.';
    return ph === 'night' ? '' : 'Kênh Sói chỉ mở ban đêm.';
  }
  if (ch === 'dead') return alive && ph !== 'end' ? 'Chỉ người đã chết dùng kênh này.' : '';
  return 'Kênh không hợp lệ.';
}
const CH_NAME = { day: 'Chung', wolf: 'Sói', dead: 'Người chết' };
function chatSees(ch) {   // kênh nào mình được đọc
  if (ch === 'day' || me.spec || S.phase === 'end') return true;
  if (ch === 'wolf') return (S.roles || {})[me.pid] === 'wolf';
  if (ch === 'dead') { const p = (S.players || {})[me.pid]; return !!p && !p.alive; }
  return false;
}
const chatMsgs = ch => Object.entries(S.chat || {}).filter(([, m]) => m.c === ch).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-60);
// Trong ván, mỗi kênh là MỘT KHUNG RIÊNG, ô nhập riêng, không bao giờ nhầm đêm/ngày:
//   Chat làng (ban ngày) · Chat Sói (ban đêm, chỉ Sói thấy) · Chat người chết
const wolfAlias = pid => {   // khán giả không thấy tên thật của Sói: chỉ "Sói 1", "Sói 2"… (đánh số theo thứ tự vào phòng)
  const roles = S.roles || {}, pl = S.players || {}, ws = Object.keys(roles).filter(id => roles[id] === 'wolf').sort((a, b) => ((pl[a] || {}).t || 0) - ((pl[b] || {}).t || 0)), i = ws.indexOf(pid);
  return i >= 0 ? 'Sói ' + (i + 1) : 'Sói';
};
const msgBub = (m, chip) => `<div class="msg bub ${m.pid === me.pid ? 'mine' : ''}"><div class="who">${chip ? `<span class="chn ${m.c}">${CH_NAME[m.c] || 'Chung'}</span> ` : ''}${m.pid === me.pid ? '' : me.spec && m.c === 'wolf' ? wolfAlias(m.pid) : esc(m.name)}</div><div class="tx">${esc(m.text)}</div></div>`;   // tin của mình ở bên phải, của người khác bên trái
function chatBox(ch) {
  const why = chatRule(ch), draft = chatDrafts[ch] || '';
  const T = { day: S.phase === 'end' ? ['💬 Chat chung', 'hết ván, ai cũng nói được'] : ['💬 Chat làng', 'ban ngày'], wolf: ['🐺 Chat Sói', 'ban đêm · chỉ Sói thấy'], dead: ['💀 Chat người chết', 'chỉ người chết thấy'] }[ch];
  const msgs = chatMsgs(ch);
  return `<div class="card chat sm ${ch}"><div class="sec">${T[0]}<span class="note" style="margin-left:6px;font-weight:400">${T[1]}</span><span class="open ${why ? 'closed' : ''}">${why ? 'đang đóng' : 'đang mở'}</span></div>
  <div class="chatlist" id="chatlist-${ch}">${msgs.length ? msgs.map(([, m]) => msgBub(m, false)).join('') : '<div class="note">Chưa có tin nhắn.</div>'}</div>
  ${why ? `<div class="note" style="margin-bottom:8px">${esc(why)}</div>` : ''}
  <div class="chatrow"><input data-bind="chat" data-ch="${ch}" maxlength="200" placeholder="${why ? 'Không thể gửi lúc này' : 'Nhập tin nhắn…'}" value="${esc(draft)}" ${why ? 'disabled' : ''} autocomplete="off">
  <button class="primary" data-act="send" data-ch="${ch}" ${why ? 'disabled' : ''}>Gửi</button></div></div>`;
}
function chatSplit() {
  const p = S.players || {}, mine = (S.roles || {})[me.pid], alive = p[me.pid] && p[me.pid].alive;
  const chs = me.spec ? ['day', 'wolf', 'dead'] : ['day'];   // khán giả đọc được cả ba khung (chỉ đọc); ở khung Sói tên được thay bằng Sói 1, Sói 2…
  if (!me.spec) { if (mine === 'wolf') chs.push('wolf'); if (!alive) chs.push('dead'); }
  if (S.phase === 'night' && chs.includes('wolf')) chs.unshift(chs.splice(chs.indexOf('wolf'), 1)[0]);   // đêm: khung Sói lên đầu
  return chs.map(chatBox).join('');
}
function chatHTML() {   // phòng chờ và khán đài (đang chơi): một khung gộp; đang chơi: các khung tách riêng; hết ván: chỉ còn một khung chat chung
  if (S.phase === 'end') return chatBox('day');
  if (S.phase !== 'lobby') return chatSplit();
  const tabs = chatTabs().filter(t => !me.spec); if (!tabs.some(t => t[0] === chatTab)) chatTab = 'day';
  const msgs = Object.entries(S.chat || {}).filter(([, m]) => chatSees(m.c)).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(-80);
  const why = chatRule(chatTab);
  return `<div class="card chat"><div class="sec">💬 Chat</div>
  <div class="chatlist" id="chatlist-merged">${msgs.length ? msgs.map(([, m]) => msgBub(m, true)).join('') : '<div class="note">Chưa có tin nhắn.</div>'}</div>
  ${tabs.length > 1 ? `<div class="tabs"><span class="note" style="align-self:center">Gửi tới:</span>${tabs.map(t => `<button class="${chatTab === t[0] ? 'sel' : ''}" data-act="chatTab" data-ch="${t[0]}">${t[1]}</button>`).join('')}</div>` : ''}
  ${why ? `<div class="note" style="margin-bottom:8px">${esc(why)}</div>` : ''}
  <div class="chatrow"><input data-bind="chat" data-ch="${chatTab}" maxlength="200" placeholder="${why ? 'Không thể gửi lúc này' : 'Nhập tin nhắn…'}" value="${esc(chatDrafts[chatTab] || '')}" ${why ? 'disabled' : ''} autocomplete="off">
  <button class="primary" data-act="send" data-ch="${chatTab}" ${why ? 'disabled' : ''}>Gửi</button></div></div>`;
}
async function sendChat(ch) {
  ch = ch || chatTab; const text = (chatDrafts[ch] || '').trim().slice(0, 200); if (!text || !S || chatRule(ch)) return;
  const id = tnow().toString(36).padStart(9, '0') + '_' + rid();
  chatDrafts[ch] = '';
  await B.set(base() + 'chat/' + id, { c: ch, pid: me.pid, name: me.name, text, t: tnow() });
  focusChat(0, ch);
}

/* ============ Chat tổng (ai nhập tên cũng chat được; giữ 7 ngày, hiện 100 tin mới nhất) ============ */
const gcSaved = () => store().getItem('gchat_name') || '';
function gcStart() {
  if (gcUnwatch) gcUnwatch();

  B.pruneOld('gchat', Date.now() - GC_KEEP_DAYS * 86400000).catch(() => {});

function gcStop() { if (gcUnwatch) gcUnwatch(); gcUnwatch = null; gcMsgs = {}; }
function gcSetName() {
  const n = gcName.trim().slice(0, 20);

async function gcSend() {
  const name = gcSaved(), text = gcDraft.trim().slice(0, 300); if (!name || !text) return;

function gcHTML() {

  const list = msgs.length ? msgs.map(([, m]) => `<div class="msg"><span class="note" style="font-size:11px">${tm(m.t)}</span> <b style="${m.name === name ? '' : 'color:#009765'}">${esc(m.name || 'Ẩn danh')}:</b> ${esc(m.text)}</div>`).join('') : '<div class="note">Chưa có tin nhắn. Hãy là người đầu tiên!</div>';

function gchatRender() {
  const ae = document.activeElement, bind = ae && ae.dataset && ae.dataset.bind, caret = bind && ae.selectionStart != null ? ae.selectionStart : 0;
  const ol = document.getElementById('gchatlist'), stick = !ol || ol.scrollTop + ol.clientHeight >= ol.scrollHeight - 8, top = ol ? ol.scrollTop : 0;
  $app.innerHTML = shell(gcHTML());

}

function bedSVG(x, y, sc, l) {

    ${t >= 4 ? `<path d="M-3 -8 Q32 -26 67 -8 L67 6 Q32 -10 -3 6Z" fill="${c}" opacity=".75"/>` : ''}

const NG_DOOR_MAX = 50, NG_GUN_MAX = 49, NG_BOSS_MAX = 25, NG_MON_MAX = 50;
const pad2 = n => String(n).padStart(2, '0'), imgTag = (kind, n, x, y, w, h, cls = '') => `<image ${cls ? `class="${cls}" ` : ''}href="img/${kind}/${pad2(n)}.webp?v=3" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMax meet"/>`;
function doorSVG(x, y, l, hp, hit) {   // ảnh cửa 116×145 (vẽ bằng Flow), vết nứt vẽ đè lên theo máu
  const w = 76, h = 95, X = x - 6, Y = 90; let g = imgTag('door', Math.min(NG_DOOR_MAX, l), X, Y, w, h);

function impactSVG(big) {   // tia lửa + sóng xung kích ở cửa mỗi lần quái đánh

function caroWinLine(board, r, c, mark) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [ck(r, c)];
    for (const sgn of [1, -1]) {

}

  return `<div class="stack">${top}

        <div class="card"><div class="sec">Cách chơi nhanh</div><ol class="steps" style="font-size:14px"><li>Đăng ký hoặc đăng nhập.</li><li>Nhập số phòng, gửi cho bạn bè.</li><li>Bạn bè vào là ván bắt đầu (X đi trước, chọn ngẫu nhiên).</li><li>Thắng 3 điểm, hòa 1 điểm. Thành tích lưu theo tên.</li></ol></div>

}
function caroRoomHTML() {
  const players = C.players || {}, ids = Object.keys(players), mark = caroMark(), board = C.board || {};
  const byMark = m => ids.find(id => players[id].mark === m), nm = id => id ? esc(players[id].name) : '…';
  const win = new Set(C.winLine || []), canMove = C.phase === 'play' && !cme.spec && C.turn === mark;
  const turnName = byMark(C.turn);
  let todo, dim = false;
  if (C.phase === 'wait') { todo = '⏳ Chờ người thứ hai vào. Gửi số phòng cho bạn bè bằng nút “Mời bạn bè”.'; dim = true; }
  else if (cme.spec) { todo = '👀 Bạn đang xem. Khán giả xem được bàn cờ nhưng không đánh được.'; dim = true; }
  else if (C.phase === 'end') todo = C.winner === 'draw' ? '🤝 Hòa! Bàn đã đầy. Bấm “Chơi lại” để đổi quân.' : C.winner === mark ? '🏆 Bạn thắng! Bấm “Chơi lại” để đổi quân.' : '😢 Bạn thua. Bấm “Chơi lại” để đổi quân.';
  else if (canMove) todo = `Đến lượt bạn: bấm vào một ô trống để đánh ${mark}.`;
  else { todo = `Chờ ${nm(turnName)} đánh…`; dim = true; }
  if (C.phase === 'end' && C.resigned) todo += ` (${nm(byMark(C.resigned))} đã xin thua)`;
  if (C.phase === 'end' && C.left) todo += ` (${nm(byMark(C.left))} đã rời phòng nên đối thủ được xử thắng)`;
  const opp = caroOpp(), oppLeft = opp && opp.off && C.phase !== 'wait';
  const leftNote = oppLeft ? `<div class="note" style="background:#FFF4E5;color:#B45309;border-radius:12px;padding:12px 14px;margin-bottom:10px">⚠️ <b>${esc(opp.name)}</b> đã rời phòng${C.phase === 'play' ? '. Bạn có thể nhận thắng ngay, hoặc cứ ngồi chờ, họ quay lại là chơi tiếp.' : '. Chưa thể chơi lại cho đến khi họ quay lại.'}${C.phase === 'play' ? '<div style="margin-top:8px"><button class="primary" data-act="cclaim">🏆 Nhận thắng ngay</button></div>' : ''}</div>` : '';
  const cells = [];
  for (let r = 0; r < CARO_SIZE; r++) for (let c = 0; c < CARO_SIZE; c++) {
    const k = ck(r, c), v = board[k] || '';
    cells.push(`<button class="cc ${v ? v.toLowerCase() : ''} ${C.last === k ? 'last' : ''} ${win.has(k) ? 'win' : ''} ${!v && canMove ? 'my' : ''}" data-act="cell" data-r="${r}" data-c="${c}" data-m="${mark || ''}" ${v || !canMove ? 'disabled' : ''}>${v}</button>`);
  }
  const prow = m => { const id = byMark(m); return `<div class="pl2 ${C.phase === 'play' && C.turn === m ? 'turn' : ''}"><span class="mk ${m.toLowerCase()}">${m}</span>${id ? avatar(players[id].name, '', id) : ''}<div><b>${nm(id)}${id === cme.pid ? ' (bạn)' : ''}</b><div class="note">${id ? (C.phase === 'play' && C.turn === m ? 'đang đến lượt' : '') : 'chờ đối thủ'}</div></div></div>`; };
  const specs = Object.values(C.spectators || {});
  const result = C.phase === 'end' ? (C.winner === 'draw' ? 'Hòa' : `${nm(byMark(C.winner))} (${C.winner}) thắng`) : '';
  return `<div class="cols"><div class="stack">
    <div class="status"><span class="chip ${C.phase === 'play' ? 'amber' : C.phase === 'end' ? 'green' : 'mute'}">${C.phase === 'play' ? '🎮 Đang chơi' : C.phase === 'end' ? '🏁 Kết thúc' : '⏳ Chờ đối thủ'}</span><span class="chip mute">Nước thứ ${C.moves || 0}</span>${result ? `<span class="chip green">${result}</span>` : ''}</div>
    ${leftNote}
    <div class="todo ${dim ? 'dim' : ''}">${todo}</div>
    <div class="card"><div class="cboard">${cells.join('')}</div></div>
  </div><div class="stack">
    <div class="card"><div class="sec">Người chơi</div><div class="stack" style="gap:10px">${prow('X')}${prow('O')}</div></div>
    ${caroChatHTML()}
    <div class="card"><div class="row">
      ${C.phase === 'end' && !cme.spec ? `<button class="primary" data-act="crematch" ${oppLeft ? 'disabled' : ''}>🔄 Chơi lại</button>` : ''}
      ${C.phase === 'play' && !cme.spec ? '<button data-act="cresign">🏳️ Xin thua</button>' : ''}
      <button data-act="invite">📨 Mời bạn bè</button>
      <button class="ghost" data-act="leave">Rời phòng</button></div></div>
    ${specs.length ? `<div class="card"><div class="sec">👀 Khán giả (${specs.length})</div>${specs.map(x => esc(x.name)).join(', ')}</div>` : ''}
    <div class="card"><div class="sec">Luật</div><p class="note">Xếp đủ ${CARO_WIN} ô liền nhau (ngang, dọc, chéo) để thắng. X đi trước. Ô viền vàng là nước đi vừa rồi.</p></div>
  </div></div>`;
}

/* ============ Sự kiện ============ */
async function submit(kind) {

document.addEventListener('input', e => {
  const k = e.target.dataset.bind; if (!k) return;
  if (k === 'name') homeName = e.target.value; else if (k === 'chat') chatDrafts[e.target.dataset.ch || 'day'] = e.target.value; else if (k === 'cchat') cDraft = e.target.value; else if (k === 'gchat') gcDraft = e.target.value; else if (k === 'ncname') ncName = e.target.value; else if (k === 'ncchat') ncDraft = e.target.value; else if (k === 'nccode') ncCode = e.target.value.toUpperCase(); else if (k === 'gname') gcName = e.target.value; else if (k === 'mname') msgName = e.target.value; else if (k === 'mtext') msgText = e.target.value; else if (k === 'aname') authName = e.target.value; else if (k === 'apass') authPass = e.target.value; else homeCode = e.target.value.toUpperCase();
});
document.addEventListener('keydown', e => {

  if (e.key === 'Enter' && (k === 'code' || k === 'name')) { e.preventDefault(); game === 'caro' ? caroJoin() : joinOrCreate(); }
});

  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'helpBg') { if (e.target === el) { showHelp = false; render(); } return; }

  if (a === 'crematch') { caroRematch(); return; }
  if (a === 'csend') { caroSendChat(); return; }
  if (a === 'gsend') { gcSend(); return; }
  if (a === 'nbuy') { nguBuy(el.dataset.k); return; }
  if (a === 'ncjoin') { ncJoin(); return; }
  if (a === 'ncsend') { ncChatSend(); return; }
  if (a === 'ncleave') { ncLeave().then(() => nguRender()); return; }
  if (a === 'ncbuy') { ncBuy(el.dataset.k); return; }
  if (a === 'ncgift') { ncGift(el.dataset.pid); return; }
  if (a === 'nccopy') { copyText(NCm.code); return; }
  if (a === 'nreset') { if (confirm('Xoá hết tiến trình và chơi lại từ đầu?')) { NG = nguNew(); nguSave(); nguRender(); } return; }
  if (a === 'gname') { gcSetName(); return; }
  if (a === 'gchange') { store().removeItem('gchat_name'); gcName = ''; render(); return; }
  if (a === 'login') { caroLogin(); return; }
  if (a === 'register') { caroRegister(); return; }

  if (a === 'rank') { showRank = !showRank; if (showRank) rankData = null; render(); return; }

  if (a === 'cresign') { caroResign(); return; }

  if (a === 'go') {
    const g = el.dataset.game; if (g === game) return; donateOk = false; msgStatus = '';
    (async () => { if (game === 'masoi' && me) await leave(); if (game === 'caro' && cme) await caroLeave(); if (game === 'gchat') gcStop(); if (game === 'ngu') { nguSave(); if (NCm) await ncLeave(); } game = g; homeErr = ''; if (g === 'gchat') gcStart(); if (g === 'ngu') nguStart(); render(); })();
    return;
  }
  if (a === 'join') { game === 'caro' ? caroJoin() : joinOrCreate(); } else if (a === 'leave') { game === 'caro' ? caroLeave() : leave(); }
  else if (a === 'home') { if (game === 'ngu') { nguSave(); (async () => { if (NCm) await ncLeave(); game = 'masoi'; render(); })(); } else if (game === 'gchat') { gcStop(); game = 'masoi'; render(); } else if (game === 'donate' || game === 'menu') { game = 'masoi'; render(); } else if (game === 'caro') { if (cme) caroLeave(); } else if (me) leave(); }
  else if (a === 'cycleDay') { if (S && S.host === me.pid && S.phase === 'lobby') B.set(base() + 'dayTime', DAY_OPTIONS[(DAY_OPTIONS.indexOf(durOf(S, 'day')) + 1) % DAY_OPTIONS.length]); }
  else if (a === 'pickRoom') { homeCode = el.dataset.code; render(); const i = document.querySelector((homeName || game === 'caro') ? '[data-bind=code]' : '[data-bind=name]'); if (i) i.focus(); }

  else if (a === 'start') sendCmd('start'); else if (a === 'again') sendCmd('again'); else if (a === 'ready') ready();
  else if (a === 'toggleRole') { showRole = !showRole; if (showRole) roleSeen = true; render(); }
  else if (a === 'invite') invite();
  else if (a === 'copy') copyText(el.dataset.text);

/* ============ Số người online + danh sách phòng đang mở ============ */
// Online: mỗi trang đang mở ghi meta/online/<mã> (giờ máy chủ) mỗi 25 giây và tự bị xoá khi ngắt kết nối; đếm các nút còn mới (< 80 giây).
let onlineN = 0;
const updateOnline = () => document.querySelectorAll('.onlinecnt').forEach(e => { e.textContent = onlineN; });
function presenceStart() {
  const path = 'meta/online/' + rid() + rid();
  B.onDisc(path);
  const ping = () => B.set(path, tnow()).catch(() => {});
  ping(); setInterval(ping, 25000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
  B.watch('meta/online', v => { const t = tnow(); onlineN = Object.values(v || {}).filter(x => typeof x === 'number' && t - x < 80000).length; updateOnline(); });
}
// Danh sách phòng: chỉ theo dõi khi đang ở trang chủ Ma sói / Cờ caro; chỉ vẽ lại khung danh sách (không vẽ lại cả trang để không mất ô đang gõ)
let rlKind = '', rlRaw = null, rlUnwatch = null, rlSig = '';
const homeKind = () => B.mode !== 'firebase' ? '' : game === 'masoi' && !me ? 'rooms' : game === 'caro' && !cme ? 'caro' : '';
function roomListItems() {
  const t = tnow(), out = [];
  for (const [code, r] of Object.entries(rlRaw || {})) {
    if (!r || !r.players) continue;
    const pl = Object.entries(r.players), seen = r.seen || {}, spec = Object.keys(r.spectators || {}).length;
    const onlineH = pl.filter(([id, p]) => !p.bot && seen[id] && t - seen[id] < ONLINE_MS + 15000).length;
    if (!onlineH) continue;   // không còn ai online thì không hiện
    const host = r.players[r.host] ? r.players[r.host].name : '';
    if (rlKind === 'rooms') {
      const n = pl.length, alive = pl.filter(([, p]) => p.alive).length, rdy = pl.filter(([, p]) => p.ready).length, ph = r.phase;
      const st = ph === 'lobby' ? `⏳ Đang chờ · ${n}/${MAX} người · ${rdy} sẵn sàng` : ph === 'night' ? `🌙 Đang chơi · Đêm thứ ${r.round} · ${alive}/${n} còn sống` : ph === 'day' ? `☀️ Đang chơi · ${r.round === 0 ? 'Mở đầu ván (làm quen)' : 'Ngày thứ ' + r.round + ' (thảo luận)'} · ${alive}/${n} còn sống` : ph === 'vote' ? `🗳️ Đang chơi · Bỏ phiếu ngày ${r.round} · ${alive}/${n} còn sống` : `🏁 Vừa kết thúc · ${n} người`;
      const can = ph === 'lobby' && n < MAX ? 'Vào' : r.allowSpec === false ? '' : 'Xem';
      out.push({ code, st, host, spec, can, ord: r.createdAt || 0 });
    } else {
      const names = pl.map(([, p]) => p.name).join(' vs '), ph = r.phase;
      const st = ph === 'wait' ? `⏳ Đang chờ đối thủ · ${pl.length}/2 người` : ph === 'play' ? `🎮 Đang chơi · ${r.moves || 0} nước` : `🏁 Vừa kết thúc`;
      out.push({ code, st, host: names, spec, can: pl.length < 2 ? 'Vào' : 'Xem', ord: r.createdAt || 0 });
    }
  }
  return out.sort((a, b) => b.ord - a.ord).slice(0, 15);
}
function roomListInner() {
  const it = roomListItems();
  return `<div class="note">🟢 ${onlineN} người đang online · ${it.length} phòng đang mở</div>` + (it.length ? it.map(x => `<div class="rrow"><span class="rc">${esc(x.code)}</span><div class="ri">${x.st}<div class="note">${rlKind === 'rooms' ? 'Chủ phòng: ' : ''}${esc(x.host)}${x.spec ? ` · 👀 ${x.spec} khán giả` : ''}</div></div>${x.can ? `<button data-act="pickRoom" data-code="${esc(x.code)}">${x.can === 'Vào' ? 'Chọn phòng này' : 'Chọn để xem'}</button>` : '<span class="note">đã đóng khán đài</span>'}</div>`).join('') : '<div class="note" style="margin-top:8px">Chưa có phòng nào đang mở. Nhập số phòng ở trên để tạo phòng mới.</div>');
}
function roomsCardHTML() { return B.mode !== 'firebase' ? '' : `<div class="card"><div class="sec">🏠 Phòng đang mở</div><div id="roomlist">${roomListInner()}</div></div>`; }
function refreshRoomList() {
  const k = homeKind();
  if (k !== rlKind) { if (rlUnwatch) rlUnwatch(); rlUnwatch = null; rlKind = k; rlRaw = null; rlSig = ''; if (k) rlUnwatch = B.watch(k, v => { rlRaw = v; refreshRoomList(); }); }
  const el = document.getElementById('roomlist'); if (!el || !k) return;
  const html = roomListInner(); if (html !== rlSig) { rlSig = html; el.innerHTML = html; }
}
setInterval(refreshRoomList, 2000);

/* ============ Khởi động ============ */
B = await makeBackend();
if (B.mode === 'firebase') presenceStart();
if (B.mode === 'firebase') B.watch('meta/botBeat', v => { botBeat = v || 0; beatLoaded = true; updateClock(); tickHost(); });
homeName = store().getItem('masoi_name') || '';
const qRoom = new URLSearchParams(location.search).get('room');
if (qRoom) homeCode = qRoom.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
me = JSON.parse(store().getItem('masoi_me') || 'null');
window.__masoi = { B, get S() { return S; }, get me() { return me; }, get C() { return C; }, get cme() { return cme; }, setBeat(v) { botBeat = v; beatLoaded = true; } };  // dùng khi gỡ lỗi
await resumeAuth();
cme = JSON.parse(store().getItem('caro_me') || 'null');
if (cme && !auth) { store().removeItem('caro_me'); cme = null; }   // chưa đăng nhập thì không tự vào phòng
const qGame = new URLSearchParams(location.search).get('game');
if (me) game = 'masoi'; else if (cme || qGame === 'caro') game = 'caro'; else if (qGame === 'menu') game = 'menu'; else if (qGame === 'donate' && window.SHOW_DONATE !== false) game = 'donate'; else if (qGame === 'chat') { game = 'gchat'; gcStart(); } else if (qGame === 'ngu' && window.SHOW_NGU !== false) { game = 'ngu'; nguStart(); }
if (game === 'caro') { if (cme) caroEnter(cme); else render(); } else if (me) enter(me); else render();
</script>
